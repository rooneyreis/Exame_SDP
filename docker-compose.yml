# Global-Scale System — Docker Compose
# Fixed IPs on the "globalnet" bridge; every service also gets the alias <name>.global.local.
# Only nginx:443 is published on the host (added in Phase 3).

name: gss

networks:
  globalnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
          # Containers without a fixed IP (test clients, pgclient) get one from here,
          # so they never take the fixed IP of a service that starts later.
          ip_range: 172.28.0.192/26

x-postgres: &postgres
  image: postgres:16
  entrypoint: ["/usr/local/bin/gss-entrypoint.sh"]
  shm_size: 128mb
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres -h /var/run/postgresql"]
    interval: 3s
    timeout: 3s
    retries: 40
  stop_grace_period: 30s

x-postgres-env: &postgres-env
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
  REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-change-me-too}
  AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-auth-pass}
  COORD_DB_PASSWORD: ${COORD_DB_PASSWORD:-coord-pass}
  API_DB_PASSWORD: ${API_DB_PASSWORD:-api-pass}

volumes:
  # Storage of the NFS server itself (local disk of the "nfs" node).
  nfs-data:
  pg-core-data:
  pg-europa-data:
  pg-europa-replica-data:
  pg-america-data:
  pg-america-replica-data:
  legacy-data:

  # Distributed file system as seen by the other nodes: an NFS v4 mount of nfs:/audit.
  # The Docker daemon does the mount, so client containers need no extra privileges.
  audit:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=172.28.0.50,nfsvers=4,rw,hard,timeo=50"
      device: ":/audit"

services:
  nfs:
    build: ./infra/nfs
    container_name: nfs
    hostname: nfs
    # Ganesha's VFS backend uses open_by_handle_at(), which needs this capability.
    cap_add:
      - DAC_READ_SEARCH
    volumes:
      - nfs-data:/audit
    networks:
      globalnet:
        ipv4_address: 172.28.0.50
        aliases: [nfs.global.local]
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/2049'"]
      interval: 3s
      timeout: 2s
      retries: 20
    restart: unless-stopped

  # ---------------- PostgreSQL ----------------
  pg-core:
    <<: *postgres
    container_name: pg-core
    hostname: pg-core
    environment:
      <<: *postgres-env
      NODE_NAME: pg-core
    volumes:
      - pg-core-data:/var/lib/postgresql/data
      - ./infra/postgres/init/core:/docker-entrypoint-initdb.d:ro
      - ./infra/postgres/entrypoint.sh:/usr/local/bin/gss-entrypoint.sh:ro
      - ./infra/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./infra/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./infra/certs:/certs:ro
    networks:
      globalnet:
        ipv4_address: 172.28.0.60
        aliases: [pg-core.global.local]

  pg-europa:
    <<: *postgres
    container_name: pg-europa
    hostname: pg-europa
    environment:
      <<: *postgres-env
      NODE_NAME: pg-europa
      PEER_HOST: pg-europa-replica.global.local
      INITIAL_ROLE: primary
      SHARD_REGION: EU
    volumes:
      - pg-europa-data:/var/lib/postgresql/data
      - ./infra/postgres/init/shard:/docker-entrypoint-initdb.d:ro
      - ./infra/postgres/entrypoint.sh:/usr/local/bin/gss-entrypoint.sh:ro
      - ./infra/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./infra/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./infra/certs:/certs:ro
    networks:
      globalnet:
        ipv4_address: 172.28.0.61
        aliases: [pg-europa.global.local]

  pg-europa-replica:
    <<: *postgres
    container_name: pg-europa-replica
    hostname: pg-europa-replica
    environment:
      <<: *postgres-env
      NODE_NAME: pg-europa-replica
      PEER_HOST: pg-europa.global.local
      INITIAL_ROLE: replica
      SHARD_REGION: EU
    volumes:
      - pg-europa-replica-data:/var/lib/postgresql/data
      - ./infra/postgres/init/shard:/docker-entrypoint-initdb.d:ro
      - ./infra/postgres/entrypoint.sh:/usr/local/bin/gss-entrypoint.sh:ro
      - ./infra/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./infra/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./infra/certs:/certs:ro
    networks:
      globalnet:
        ipv4_address: 172.28.0.62
        aliases: [pg-europa-replica.global.local]

  pg-america:
    <<: *postgres
    container_name: pg-america
    hostname: pg-america
    environment:
      <<: *postgres-env
      NODE_NAME: pg-america
      PEER_HOST: pg-america-replica.global.local
      INITIAL_ROLE: primary
      SHARD_REGION: AM
    volumes:
      - pg-america-data:/var/lib/postgresql/data
      - ./infra/postgres/init/shard:/docker-entrypoint-initdb.d:ro
      - ./infra/postgres/entrypoint.sh:/usr/local/bin/gss-entrypoint.sh:ro
      - ./infra/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./infra/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./infra/certs:/certs:ro
    networks:
      globalnet:
        ipv4_address: 172.28.0.63
        aliases: [pg-america.global.local]

  pg-america-replica:
    <<: *postgres
    container_name: pg-america-replica
    hostname: pg-america-replica
    environment:
      <<: *postgres-env
      NODE_NAME: pg-america-replica
      PEER_HOST: pg-america.global.local
      INITIAL_ROLE: replica
      SHARD_REGION: AM
    volumes:
      - pg-america-replica-data:/var/lib/postgresql/data
      - ./infra/postgres/init/shard:/docker-entrypoint-initdb.d:ro
      - ./infra/postgres/entrypoint.sh:/usr/local/bin/gss-entrypoint.sh:ro
      - ./infra/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./infra/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./infra/certs:/certs:ro
    networks:
      globalnet:
        ipv4_address: 172.28.0.64
        aliases: [pg-america-replica.global.local]

  # ---------------- Application services ----------------
  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    container_name: auth
    hostname: auth
    environment:
      AUTH_DB_DSN: "host=pg-core.global.local dbname=auth user=auth_svc password=${AUTH_DB_PASSWORD:-auth-pass} sslmode=verify-full sslrootcert=/certs/ca.crt"
      API_URLS: "https://api-1.global.local:8000,https://api-2.global.local:8000"
    volumes:
      - ./infra/certs:/certs:ro
      # Only auth gets the RS256 private key and the AES data key.
      - ./infra/keys/private/auth-rs256.pem:/keys/private/auth-rs256.pem:ro
      - ./infra/keys/private/auth-data.key:/keys/private/auth-data.key:ro
      - audit:/audit
    depends_on:
      nfs: { condition: service_healthy }
      pg-core: { condition: service_healthy }
    networks:
      globalnet:
        ipv4_address: 172.28.0.20
        aliases: [auth.global.local]
    healthcheck:
      test: ["CMD", "python", "-c", "import ssl,urllib.request; urllib.request.urlopen('https://auth.global.local:8010/health', context=ssl.create_default_context(cafile='/certs/ca.crt'), timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  legacy-bank:
    build: ./legacy-bank
    container_name: legacy-bank
    hostname: legacy-bank
    environment:
      MAX_SETTLEMENT: ${MAX_SETTLEMENT:-20000}
    volumes:
      - ./infra/certs/legacy-bank.p12:/certs/legacy-bank.p12:ro
      - ./infra/keys/private/legacy-bank-ed25519.pem:/keys/private/legacy-bank-ed25519.pem:ro
      - ./infra/keys/public/coordinator-ed25519.pub.pem:/keys/public/coordinator-ed25519.pub.pem:ro
      - legacy-data:/data          # fixed-width ledger (ledger.dat)
    networks:
      globalnet:
        ipv4_address: 172.28.0.40
        aliases: [legacy-bank.global.local]
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9443'"]
      interval: 3s
      timeout: 2s
      retries: 30
    restart: unless-stopped

  coordinator:
    build:
      context: .
      dockerfile: services/coordinator/Dockerfile
    container_name: coordinator
    hostname: coordinator
    environment:
      COORD_DB_PASSWORD: ${COORD_DB_PASSWORD:-coord-pass}
      TRUSTED_SIGNERS: api-1,api-2
    volumes:
      - ./infra/certs:/certs:ro
      # Public keys: verifies api-1/api-2 requests and the legacy bank's acknowledgements.
      - ./infra/keys/public:/keys/public:ro
      # Its own private key: signs the settlement orders sent to the legacy bank.
      - ./infra/keys/private/coordinator-ed25519.pem:/keys/private/coordinator-ed25519.pem:ro
      - audit:/audit
    depends_on:
      nfs: { condition: service_healthy }
      legacy-bank: { condition: service_healthy }
      pg-core: { condition: service_healthy }
      pg-europa: { condition: service_healthy }
      pg-america: { condition: service_healthy }
    networks:
      globalnet:
        ipv4_address: 172.28.0.30
        aliases: [coordinator.global.local]
    healthcheck:
      test: ["CMD", "python", "-c", "import ssl,urllib.request; urllib.request.urlopen('https://coordinator.global.local:8020/health', context=ssl.create_default_context(cafile='/certs/ca.crt'), timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Restarts by itself after a crash (chaos crash_after_*): then the recovery loop
    # finishes the interrupted transactions.
    restart: unless-stopped

  api-1: &api
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: api-1
    hostname: api-1
    environment:
      INSTANCE_ID: api-1
      API_DB_PASSWORD: ${API_DB_PASSWORD:-api-pass}
      JWKS_URL: https://auth.global.local:8010/.well-known/jwks.json
    volumes:
      - ./infra/certs:/certs:ro
      # Each instance gets ONLY its own Ed25519 private key (signs requests to the coordinator).
      - ./infra/keys/private/api-1-ed25519.pem:/keys/private/signing-ed25519.pem:ro
      - audit:/audit
    depends_on:
      nfs: { condition: service_healthy }
      auth: { condition: service_healthy }
      coordinator: { condition: service_healthy }
    networks:
      globalnet:
        ipv4_address: 172.28.0.11
        aliases: [api-1.global.local]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import ssl,urllib.request,os; urllib.request.urlopen('https://' + os.environ['INSTANCE_ID'] + '.global.local:8000/health', context=ssl.create_default_context(cafile='/certs/ca.crt'), timeout=3)\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api-2:
    <<: *api
    container_name: api-2
    hostname: api-2
    environment:
      INSTANCE_ID: api-2
      API_DB_PASSWORD: ${API_DB_PASSWORD:-api-pass}
      JWKS_URL: https://auth.global.local:8010/.well-known/jwks.json
    volumes:
      - ./infra/certs:/certs:ro
      - ./infra/keys/private/api-2-ed25519.pem:/keys/private/signing-ed25519.pem:ro
      - audit:/audit
    networks:
      globalnet:
        ipv4_address: 172.28.0.12
        aliases: [api-2.global.local]

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    hostname: nginx
    ports:
      - "443:443"            # the only port published on the host
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/certs:/certs:ro
    depends_on:
      auth: { condition: service_healthy }
      api-1: { condition: service_healthy }
      api-2: { condition: service_healthy }
    networks:
      globalnet:
        ipv4_address: 172.28.0.10
        aliases: [nginx.global.local]
    restart: unless-stopped

  # psql client on globalnet (profile "tools"): used by seed.sh and the tests.
  # Usage: docker compose run --rm -T pgclient "<conninfo>" -c "SELECT 1"
  pgclient:
    image: postgres:16
    profiles: [tools]
    entrypoint: ["psql", "-v", "ON_ERROR_STOP=1", "-X"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-change-me}
      PGUSER: postgres
      PGSSLROOTCERT: /certs/ca.crt
      PGCONNECT_TIMEOUT: "5"
    volumes:
      - ./infra/certs/ca.crt:/certs/ca.crt:ro
      - ./scripts/sql:/sql:ro
    networks: [globalnet]

  # --- Phase 0 test clients (profile "nfs-test"): two nodes writing to the same NFS files ---
  nfs-test-a: &nfs-test
    image: python:3.12-slim
    profiles: [nfs-test]
    depends_on:
      nfs:
        condition: service_healthy
    volumes:
      - audit:/audit
      - ./tests/integration/nfs_writer.py:/nfs_writer.py:ro
    networks: [globalnet]
    command: ["python", "/nfs_writer.py", "node-a", "node-b"]

  nfs-test-b:
    <<: *nfs-test
    command: ["python", "/nfs_writer.py", "node-b", "node-a"]
