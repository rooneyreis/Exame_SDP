# NFS-Ganesha configuration: a single NFS v4 export (/audit) for audit logs and reports.

NFS_CORE_PARAM {
    Protocols = 4;          # NFS v4 only: no rpcbind/mountd/NLM needed (locks are part of v4)
    NFS_Port = 2049;
    Enable_NLM = false;
    Enable_RQUOTA = false;
}

NFSV4 {
    # Skip the 90 s grace period after start. In production the grace period lets
    # clients reclaim their locks after a server restart; here it would only make
    # the demo wait. Documented as a known limitation.
    Graceless = true;
    Lease_Lifetime = 15;    # seconds a client keeps its locks without renewing
    RecoveryBackend = fs;
}

EXPORT {
    Export_Id = 1;
    Path = /audit;          # directory inside this container (backed by a Docker volume)
    Pseudo = /audit;        # path the clients mount (device ":/audit")
    Access_Type = RW;
    Squash = No_Root_Squash;
    SecType = sys;
    Protocols = 4;
    Transports = TCP;
    FSAL { Name = VFS; }
}

LOG {
    Default_Log_Level = EVENT;
}
