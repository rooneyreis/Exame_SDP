# Nginx: the only entry point exposed on the host (HTTPS 443).
# Re-encrypts to the backends (proxy_ssl_verify on: the backend certificate is checked
# against the local CA and the expected name).
# Phase 2: routes only the auth endpoints. Phase 3 adds the api-1/api-2 upstream.

worker_processes 1;
events { worker_connections 1024; }

http {
    log_format json escape=json '{"ts":"$time_iso8601","service":"nginx","request_id":"$request_id",'
                                '"method":"$request_method","uri":"$request_uri","status":$status,'
                                '"upstream":"$upstream_addr","ms":$request_time}';
    access_log /dev/stdout json;
    error_log  /dev/stderr warn;

    resolver 127.0.0.11 valid=10s ipv6=off;   # Docker internal DNS (*.global.local)

    upstream auth_backend {
        server auth.global.local:8010;
    }

    server {
        listen 443 ssl;
        server_name nginx.global.local localhost;

        ssl_certificate     /certs/nginx.crt;
        ssl_certificate_key /certs/nginx.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # TLS towards the backends, verified by the local CA
        proxy_ssl_trusted_certificate /certs/ca.crt;
        proxy_ssl_verify       on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_server_name  on;

        proxy_set_header X-Request-ID      $request_id;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Host              $host;

        # --- auth ---
        location ~ ^/(auth/|\.well-known/|admin/users|admin/staff) {
            proxy_pass https://auth_backend;
            proxy_ssl_name auth.global.local;
        }

        location = /health { return 200 '{"status":"ok","service":"nginx"}'; default_type application/json; }
    }
}
