# Nginx: the only entry point exposed on the host (HTTPS 443).
# - Load balancing (round-robin) between api-1 and api-2.
# - If an instance does not answer, the request is retried on the other one
#   (proxy_next_upstream) and the failed instance is skipped for fail_timeout.
# - Re-encrypts to the backends and verifies their certificate (proxy_ssl_verify).

worker_processes 1;
events { worker_connections 1024; }

http {
    include      /etc/nginx/mime.types;   # correct Content-Type for the frontend (.js, .css, .svg)
    default_type application/octet-stream;
    log_format json escape=json '{"ts":"$time_iso8601","service":"nginx","request_id":"$request_id",'
                                '"method":"$request_method","uri":"$request_uri","status":$status,'
                                '"upstream":"$upstream_addr","upstream_status":"$upstream_status","ms":$request_time}';
    access_log /dev/stdout json;
    error_log  /dev/stderr warn;

    # Fixed IPs (not names): nginx resolves upstream names only at start-up and would
    # refuse to start if a backend container is stopped at that moment.
    upstream api_backend {
        server 172.28.0.11:8000 max_fails=1 fail_timeout=10s;   # api-1
        server 172.28.0.12:8000 max_fails=1 fail_timeout=10s;   # api-2
        keepalive 16;
    }

    upstream auth_backend {
        server 172.28.0.20:8010;
        keepalive 8;
    }

    # HTTP simples nunca serve conteúdo: só redireciona para HTTPS.
    # (No portátil a porta 80 nem é publicada; no servidor é, via docker-compose.override.yml.)
    server {
        listen 80;
        location / { return 301 https://$host$request_uri; }
    }

    server {
        listen 443 ssl;
        server_name nginx.global.local localhost;

        ssl_certificate     /certs/nginx.crt;
        ssl_certificate_key /certs/nginx.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # TLS towards the backends, verified by the local CA
        proxy_ssl_trusted_certificate /certs/ca.crt;
        proxy_ssl_verify       on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_server_name  on;
        proxy_ssl_session_reuse on;

        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header X-Request-ID      $request_id;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Host              $host;

        proxy_connect_timeout 2s;
        proxy_read_timeout    60s;

        # --- frontend (ficheiros estáticos; a lógica continua toda nas APIs) ---
        location = / { return 302 /app/; }
        location ^~ /app/ {
            root /usr/share/nginx;              # /app/... -> /usr/share/nginx/app/...
            index index.html;
            try_files $uri $uri/ /app/index.html;
            add_header Cache-Control "no-cache" always;
            # Content-Security-Policy: só código desta origem, sem scripts inline nem
            # recursos externos; impede ser embebido noutro site (clickjacking).
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        }

        # --- auth ---
        location ~ ^/(auth/|\.well-known/|admin/users|admin/staff|admin/roles|beneficiaries|admin/beneficiaries) {
            proxy_pass https://auth_backend;
            proxy_ssl_name auth.global.local;
        }

        # --- api (everything else) ---
        location / {
            proxy_pass https://api_backend;
            proxy_ssl_name api.global.local;     # SAN present in both api-1 and api-2 certificates
            # Retry on the other instance when this one is down (connection refused/timeout)
            # or answers 502/503. POSTs are only retried if they never reached the backend
            # (no "non_idempotent"), so a deposit is never executed twice.
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
        }

        location = /lb-health { return 200 '{"status":"ok","service":"nginx"}'; default_type application/json; }
    }
}
