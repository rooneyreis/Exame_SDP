# TYPE     DATABASE     USER         ADDRESS          METHOD
# Unix socket inside the container (docker exec, init scripts): trusted.
local      all          all                           trust

# Network: TLS only, password with SCRAM-SHA-256, only from globalnet.
hostssl    replication  replicator   172.28.0.0/24    scram-sha-256
hostssl    all          all          172.28.0.0/24    scram-sha-256

# Anything without TLS (or from outside globalnet) is rejected explicitly.
hostnossl  all          all          0.0.0.0/0        reject
host       all          all          0.0.0.0/0        reject
