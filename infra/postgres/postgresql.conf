# Shared configuration of every PostgreSQL cluster: each node's own database and the copy
# it keeps of another node's database (common/topology.json).
# Passed with: postgres -c config_file=/etc/postgresql/postgresql.conf (by infra/postgres/supervisor.py)

listen_addresses = '*'
max_connections = 100                # a copy needs >= its primary: same file everywhere
shared_buffers = 64MB                # small: 9 clusters on 4 nodes on a laptop

# --- Two-Phase Commit ---
# Enables PREPARE TRANSACTION. A copy must have a value >= its primary's, otherwise a
# standby cannot replay prepared transactions from the WAL.
max_prepared_transactions = 100

# --- Streaming replication ---
wal_level = replica
max_wal_senders = 5
wal_keep_size = 256MB                # keep WAL so a copy can catch up after a short outage
hot_standby = on                     # copies accept read-only queries
# The supervisor turns synchronous replication on while the copy is streaming
# (synchronous_standby_names) and off while it is down. remote_apply: a commit is confirmed
# only once it is APPLIED on the copy, so after a takeover nothing confirmed is missing
# and reads on the copy already see it.
synchronous_commit = remote_apply
# A copy cut off by the network is noticed in seconds, not in the default 60 s.
wal_sender_timeout = 10s
wal_receiver_timeout = 10s

# --- TLS (certificates copied by infra/postgres/entrypoint.sh, one per node) ---
ssl = on
ssl_cert_file = '/var/lib/postgresql/tls/server.crt'
ssl_key_file = '/var/lib/postgresql/tls/server.key'
ssl_ca_file = '/var/lib/postgresql/tls/ca.crt'
ssl_min_protocol_version = 'TLSv1.2'
hba_file = '/etc/postgresql/pg_hba.conf'
password_encryption = scram-sha-256

# --- Avoid endless blocking between shards ---
lock_timeout = '5s'
statement_timeout = '15s'

# --- Logging ---
log_line_prefix = '%m [%p] %u@%d '
log_timezone = 'UTC'
timezone = 'UTC'
