# Shared configuration for every PostgreSQL node (pg-core, shards and replicas).
# Passed with: postgres -c config_file=/etc/postgresql/postgresql.conf

listen_addresses = '*'
max_connections = 100                # replicas need >= primary: same file everywhere
shared_buffers = 64MB                # small, to fit 5 nodes on a laptop

# --- Two-Phase Commit ---
# Enables PREPARE TRANSACTION. Replicas must have a value >= the primary's,
# otherwise a standby cannot replay prepared transactions from the WAL.
max_prepared_transactions = 100

# --- Streaming replication ---
wal_level = replica
max_wal_senders = 5
wal_keep_size = 256MB                # keep WAL so a replica can catch up after a short outage
hot_standby = on                     # replicas accept read-only queries

# --- TLS (certificates copied by infra/postgres/entrypoint.sh) ---
ssl = on
ssl_cert_file = '/var/lib/postgresql/tls/server.crt'
ssl_key_file = '/var/lib/postgresql/tls/server.key'
ssl_ca_file = '/var/lib/postgresql/tls/ca.crt'
ssl_min_protocol_version = 'TLSv1.2'
hba_file = '/etc/postgresql/pg_hba.conf'
password_encryption = scram-sha-256

# --- Avoid endless blocking between shards ---
lock_timeout = '5s'
statement_timeout = '15s'

# --- Logging ---
log_line_prefix = '%m [%p] %u@%d '
log_timezone = 'UTC'
timezone = 'UTC'
